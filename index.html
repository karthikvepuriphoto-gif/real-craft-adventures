<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Press Start 2P',monospace;background:#1d2b1d;color:#fff;font-size:12px;line-height:1.6}
header{background:#5b3a1e;border-bottom:6px solid #3a2410;padding:12px;text-align:center}
h1{margin:0;font-size:20px;color:#ffe066;text-shadow:3px 3px #000}
#stats{margin-top:8px;font-size:10px}
.bar{height:16px;background:#333;border:3px solid #000;margin:6px auto;max-width:400px}
.bar div{height:100%;background:#7ed957}
nav{display:flex;gap:6px;justify-content:center;padding:10px;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;padding:14px 16px;border:4px solid #000;background:#8b8b8b;color:#fff;cursor:pointer;box-shadow:inset -4px -4px #555,inset 4px 4px #bbb;text-shadow:2px 2px #000;min-height:52px}
button:active{box-shadow:inset 4px 4px #555}
button.on{background:#4caf50}
button.go{background:#3b8d3b}
button:disabled{opacity:.5}
main{max-width:900px;margin:auto;padding:10px}
.hidden{display:none!important}
#map{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{aspect-ratio:1;border:4px solid #000;padding:8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:9px;position:relative;
 background-image:linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.12) 75%),linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.12) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.tile .ic{font-size:34px;text-align:center}
.tile.locked{filter:grayscale(.6) brightness(.7)}
.tile.done::after{content:"✔";position:absolute;top:4px;right:6px;color:#ffe066;font-size:18px}
.card{background:#3c3c3c;border:4px solid #000;box-shadow:inset -4px -4px #222,inset 4px 4px #666;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:12px;color:#ffe066}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.item{background:#222;border:3px solid #000;padding:8px;text-align:center;min-width:90px;font-size:9px}
.item b{font-size:26px;display:block}
.badge.off{opacity:.3}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
#modal .card{max-width:480px;width:100%;max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow:auto}
img.ph{width:100%;max-width:256px;border:3px solid #000;margin-top:8px;image-rendering:pixelated}
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.pick{border:4px solid #000;padding:4px;background:#222;cursor:pointer;text-align:center;font-size:8px}
.pick img{width:100%;image-rendering:pixelated;display:block}
.pick.sel{border-color:#ffe066;background:#4caf50}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#ffe066;color:#000;border:4px solid #000;padding:12px;font-size:11px;z-index:10}
input{font-family:inherit;font-size:14px;padding:12px;border:4px solid #000;width:100%;margin:8px 0}
small{font-size:9px;color:#ccc}
.stage{position:relative;width:100%;aspect-ratio:1;border:4px solid #000;background:#222 center/cover no-repeat;overflow:hidden;container-type:inline-size;touch-action:none;image-rendering:pixelated;user-select:none}
.stk{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab;filter:drop-shadow(2px 2px 0 #000) drop-shadow(-1px -1px 0 #fff);touch-action:none}
.stk.sel{outline:3px dashed #ffe066;outline-offset:2px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin:4px 0 8px}
.trayw{max-height:240px;overflow:auto;margin:8px 0}.ptitle{font-size:9px;color:#ffe066;margin-top:6px}.ptitle small{color:#ccc;font-size:7px}
.hint{background:#ffe066;color:#000;border:3px solid #000;padding:8px;font-size:9px;margin:8px 0}
#celebrate{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;text-align:center}
#celebrate .card{max-width:420px;animation:pop .4s}#celebrate .big{font-size:52px;line-height:1.3}
@keyframes pop{0%{transform:scale(.3)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.tray button{font-size:28px;padding:4px;min-height:58px;position:relative;text-shadow:none;font-family:inherit}
.tray button.lock{filter:grayscale(1);opacity:.45}
.tray button small{position:absolute;bottom:1px;left:0;right:0;font-size:6px;color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:4px}.tools button{padding:8px 10px;font-size:11px;min-height:44px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.jent{background:#222;border:4px solid #000;padding:6px;font-size:8px;cursor:pointer}
.ph.stage{max-width:256px}
#hub{position:fixed;inset:0;z-index:8;background:#1d2b1d;background-image:linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.04) 75%),linear-gradient(45deg,rgba(255,255,255,.04) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.04) 75%);background-size:32px 32px;background-position:0 0,16px 16px;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.hubin{max-width:760px;width:100%;text-align:center}#hub h1{font-size:24px;margin:8px 0}
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.hb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;padding:22px 10px;min-height:150px}.hb b{font-size:52px;line-height:1}.hb small{font-size:9px;color:#fff}
#hubDaily .card{margin:10px auto;max-width:520px}
.tut b.big{font-size:56px;display:block;text-align:center;margin:6px 0}
</style></head><body>

<script>
var HT0=null;(function(){try{HT0=JSON.parse(localStorage.getItem("realcraft_hometown_v1")||"null")}catch(e){}if(!HT0&&(localStorage.getItem("realcraft_buildworld_v1")||localStorage.getItem("questcraft_save_v1"))){HT0={id:"lincoln",name:"Lincoln"};localStorage.setItem("realcraft_hometown_v1",JSON.stringify(HT0))}window.__htNeedPick=!HT0})();
if(HT0&&HT0.id==="lincoln")document.write('<script src="lincoln.js"><\/script>');
var HTNAME=HT0&&HT0.name?String(HT0.name).replace(/[<>&]/g,""):"Lincoln",HTLIN=!HT0||HT0.id==="lincoln";
</script>
<script>
const GAME_TITLE = "Real Craft Adventures";   // <- change the game name here
const KEY = "questcraft_save_v1";

const BIOMES = [
 {id:"backyard",name:"Home Base Backyard",ic:"🏡",color:"#5fa83a",quest:"Be a map maker! Draw your backyard on paper and mark 3 treasure spots, like a tree, a rock, and a flower.",item:"🗺️ Backyard Map",xp:20},
 {id:"pioneers",name:"Big City Park",ic:"🌳",color:"#7a9a3a",quest:"Spot 3 kinds of birds or animal tracks at a big park.",item:"🪶 Prairie Feather",xp:40},
 {id:"zoo",name:"Zoo",ic:"🦒",color:"#c9a227",quest:"Visit 5 different animals and learn one fun fact about your favorite.",item:"🥚 Mob Egg",xp:40},
 {id:"library",name:"Public Library",ic:"📚",color:"#7b5aa6",quest:"Find a book about building, nature, or Minecraft and read one chapter.",item:"📖 Enchanted Book",xp:35},
 {id:"grocery",name:"Grocery Store",ic:"🛒",color:"#d0503a",quest:"Help find 5 items on the shopping list. Spot a fruit you've never tried!",item:"🍎 Golden Apple",xp:25},
 {id:"park",name:"Neighborhood Park",ic:"🌳",color:"#3f8f3f",quest:"Climb, run, or slide. Then collect 3 cool rocks (leave the rest!).",item:"🪨 Cobblestone",xp:25},
 {id:"lake",name:"Lake or River",ic:"🌊",color:"#3a7bd5",quest:"Walk by the water and count the ducks, geese or boats.",item:"🐟 Raw Fish",xp:35},
 {id:"kahoa",name:"My School",ic:"🏫",color:"#b5651d",quest:"Invent a new recess game and teach it to a friend at school!",item:"🧩 Redstone Idea",xp:30},
 {id:"capitol",name:"State Capitol or City Hall",ic:"🏛️",color:"#c9b27a",quest:"Find a statue or a flag and count the steps at the entrance!",item:"🌾 Golden Seed",xp:40},
 {id:"garden",name:"Flower Garden",ic:"🌷",color:"#d46aa0",quest:"Find 4 flower colors. Which smells best?",item:"🌸 Flower Pot",xp:35},
 {id:"kitchen",name:"Kitchen Crafting Table",ic:"🍳",color:"#8a6a4a",quest:"Make a snack together. You're the chef!",item:"🍪 Cookie",xp:20},
 {id:"museum",name:"Natural History Museum",ic:"🦣",color:"#6a6a6a",quest:"Find a dinosaur or mammoth fossil. Draw it!",item:"🦴 Fossil Bone",xp:40},
 {id:"trail",name:"Bike Trail",ic:"🚲",color:"#4a8a6a",quest:"Ride or walk a trail and spot 5 different trees.",item:"🪵 Oak Log",xp:30},
];

if(HTLIN&&window.RCA_LINCOLN){const RN=window.RCA_LINCOLN.BIOMES;for(const b of BIOMES){const r=RN[b.id];if(r)Object.assign(b,r)}}
const MISSIONS = [
 ["Gather 5 different leaves","🍂 Leaf Stack"],["Build a shelter for a stuffed animal","🛖 Mini Shelter"],
 ["Find 3 rocks of different colors","🪨 Rock Set"],["Build a tower of 20 blocks/LEGO/cups","🧱 Tower Block"],
 ["Draw a map of your room","📜 Room Map"],["Do 20 jumping jacks","💪 Strength Potion"],
 ["Find something in every rainbow color","🌈 Rainbow Shard"],["Water a plant or help in the garden","🌱 Seed"],
 ["Make a paper airplane and fly it 3 times","✈️ Paper Plane"],["Build a pillow fort","🏰 Fort Wall"],
 ["Spot 3 different birds","🐦 Bird Feather"],["Build a cardboard robot or castle","🤖 Cardboard Robot"],
 ["Help make dinner or a snack","🥕 Carrot"],["Read for 20 minutes","📘 XP Book"],
 ["Find 5 things shaped like a square","⬛ Square Block"],["Clean your room in under 10 minutes","🧹 Speed Boots"],
 ["Do a nice thing for a family member","❤️ Heart"],["Collect 3 different seeds or pinecones","🌰 Acorn"],
 ["Build a ramp and race toy cars","🏎️ Race Car"],["Look at clouds and find 3 shapes","☁️ Cloud"],
 ["Make up a secret handshake","🤝 Friendship Token"],["Draw your dream Minecraft house on paper","🏠 Blueprint"],
 ["Count the windows in your home","🪟 Glass Pane"],["Balance on one foot for 30 seconds","🦩 Balance Charm"],
 ["Find a bug (look, don't touch!)","🐞 Bug Card"],["Make a sculpture from playdough or clay","🗿 Clay Statue"],
 ["Play catch 25 times without dropping","⚾ Ball"],["Write a short adventure story","✒️ Quill"],
 ["Sort your toys by color","🎨 Dye"],["Make an obstacle course and beat it","🏁 Flag"],
 ["Find 3 things that are older than you","⏳ Time Capsule"],["Learn to tie a new knot","🪢 Rope"],
];

const BADGES = [
 {id:"first",n:"First Step",ic:"👣",t:"Complete 1 mission",f:s=>s.missionsDone>=1},
 {id:"m10",n:"Survivor",ic:"🛡️",t:"Complete 10 missions",f:s=>s.missionsDone>=10},
 {id:"m30",n:"Legend",ic:"👑",t:"Complete 30 missions",f:s=>s.missionsDone>=30},
 {id:"b1",n:"Explorer",ic:"🧭",t:"Check in at 1 biome",f:s=>Object.keys(s.biomes).length>=1},
 {id:"b5",n:"Pathfinder",ic:"🗺️",t:"Check in at 5 biomes",f:s=>Object.keys(s.biomes).length>=5},
 {id:"ball",n:"World Master",ic:"🌍",t:"Check in everywhere",f:s=>Object.keys(s.biomes).length>=BIOMES.length},
 {id:"day3",n:"Full Day",ic:"☀️",t:"All 3 missions in one day",f:s=>Object.values(s.daily).some(a=>a.length>=3)},
 {id:"lvl5",n:"Diamond Rank",ic:"💎",t:"Reach level 5",f:s=>level(s.xp).lvl>=5},
 {id:"snap",n:"Snapshot Pro",ic:"🖼️",t:"Pick a snapshot",f:s=>Object.values(s.biomes).some(b=>b.snap)||Object.keys(s.msnap||{}).length>0},
];

let S = load();migrate();
function migrate(){let ch=false;if(S.biomes&&S.biomes.school){if(!S.biomes.kahoa)S.biomes.kahoa=S.biomes.school;delete S.biomes.school;ch=true}
 if(S.deco&&S.deco["b:school"]){if(!S.deco["b:kahoa"])S.deco["b:kahoa"]=S.deco["b:school"];delete S.deco["b:school"];ch=true}if(ch)save()}
function load(){try{return Object.assign({name:"",xp:0,missionsDone:0,biomes:{},daily:{},inv:{},badges:[],msnap:{},deco:{},packs:[],sound:true},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return {name:"",xp:0,missionsDone:0,biomes:{},daily:{},inv:{},badges:[],msnap:{},deco:{},packs:[],sound:true}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Oops, storage is full. Ask a grown-up for help!")}}
function level(xp){let l=1,need=100,x=xp;while(x>=need){x-=need;l++;need=100+(l-1)*50}return{lvl:l,cur:x,need}}
const RANKS=["Wood","Stone","Iron","Gold","Diamond","Netherite"];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function rng(seed){let h=1779033703;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function todaysMissions(){const r=rng(today());const idx=[...MISSIONS.keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx.slice(0,3)}

let actx;function beep(f=520,d=.12){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),2500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let nu;function gain(xp,item){const before=level(S.xp).lvl;S.xp+=xp;if(item)S.inv[item]=(S.inv[item]||0)+1;
 const after=level(S.xp).lvl;beep(660);if(after>before){setTimeout(()=>{beep(880,.3);toast("⬆️ LEVEL UP! Level "+after)},300)}else toast("+"+xp+" XP"+(item?"  "+item:""));
 BADGES.forEach(b=>{if(!S.badges.includes(b.id)&&b.f(S)){S.badges.push(b.id);setTimeout(()=>{beep(990,.3);toast("🏅 Badge: "+b.n)},1200)}});save();checkPacks();render()}

function render(){try{renderJournal()}catch(e){console.warn(e)}
 document.title=GAME_TITLE;document.getElementById("title").textContent=GAME_TITLE;
 const L=level(S.xp);
 document.getElementById("stats").textContent=`${S.name||"Player"} · Lv ${L.lvl} ${RANKS[Math.min(RANKS.length-1,Math.floor((L.lvl-1)/2))]} · ${S.xp} XP`;
 document.getElementById("xpbar").style.width=(L.cur/L.need*100)+"%";
 document.getElementById("soundBtn").textContent=S.sound?"🔊":"🔇";
 document.getElementById("map").innerHTML=BIOMES.map(b=>`<div class="tile ${S.biomes[b.id]?"done":"locked"}" style="background-color:${b.color}" onclick="openBiome('${b.id}')"><div class="ic">${b.ic}</div><div>${esc(b.name)}</div></div>`).join("");
 const done=S.daily[today()]||[];
 document.getElementById("tab-daily").innerHTML=`<div class="hint">${esc(nextHint())}</div><div class="card"><h3>Today's Missions (${today()})</h3><small>New missions every day!</small></div>`+
  todaysMissions().map(i=>{const[m,it]=MISSIONS[i];const d=done.includes(i);return`<div class="card"><h3>${d?"✅":"🎯"} ${esc(m)}</h3><small>Reward: 50 XP + ${it}</small><br><br><button class="go" ${d?"disabled":""} onclick="doMission(${i})">${d?"Done!":"I did it!"}</button></div>`}).join("");
 const inv=Object.entries(S.inv);
 document.getElementById("tab-inv").innerHTML=`<div class="card"><h3>🎒 Inventory</h3>${inv.length?`<div class="grid">${inv.map(([k,v])=>{const [e,...n]=k.split(" ");return`<div class="item"><b>${e}</b>${esc(n.join(" "))}<br>x${v}</div>`}).join("")}</div>`:"<small>Empty! Do missions to collect items.</small>"}</div>`;
 document.getElementById("tab-badges").innerHTML=`<div class="card"><h3>🏅 Badges ${S.badges.length}/${BADGES.length}</h3><div class="grid">${BADGES.map(b=>`<div class="item badge ${S.badges.includes(b.id)?"":"off"}"><b>${b.ic}</b>${b.n}<br><small>${b.t}</small></div>`).join("")}</div></div>`;
}
function doMission(i){const d=S.daily[today()]||[];if(d.includes(i))return;beep(440);
 modal(`<h3>🎯 ${esc(MISSIONS[i][0])}</h3>`+pickerHTML(snapChoices(null,"m"+i+today()),`finishMission(${i})`,"🏆 Complete!")+`<br><br><button onclick="closeModal()">Cancel</button>`)}
function finishMission(i){const d=S.daily[today()]=S.daily[today()]||[];if(d.includes(i))return;d.push(i);S.missionsDone++;S.msnap=S.msnap||{};const k=today()+":"+i;S.msnap[k]=picked;gain(50,MISSIONS[i][1]);openDeco("m:"+k)}
function modal(h){document.getElementById("modalBody").innerHTML=h;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
// ---- Snapshots: blocky pixel scenes drawn in code (no image files) ----
// [sky, ground, accent, emoji, label]
const SNAPS={
 backyard:["#8fd3ff","#5fa83a","#8b5a2b","🏡","Backyard Base"],pioneers:["#ffd27f","#9bb04a","#6b4a2b","🦬","Prairie Bison"],

function snapImg(id){if(IMG[id])return IMG[id];if(_snapCache[id])return _snapCache[id];const d=SNAPS[id]||SNAPS.nature;const N=32,P=8,c=document.createElement("canvas");c.width=c.height=N*P;const g=c.getContext("2d");
 const r=rng("snap"+id),shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const gy=20+Math.round(Math.sin(x/5+r()*.3)*1.5);let col=y<gy?d[0]:y<gy+1?d[1]:y<gy+4?d[1]:d[2];
  g.fillStyle=shade(col,y<gy?1-y/90:.8+r()*.3);g.fillRect(x*P,y*P,P,P)}
 g.fillStyle="#fff59a";g.fillRect(24*P,3*P,4*P,4*P);g.fillStyle="#fff";for(let i=0;i<3;i++){const cx=Math.floor(r()*20);g.fillRect(cx*P,(4+i*3)*P,6*P,P*2)}
 g.font=(N*P*.42)+"px serif";g.textAlign="center";g.textBaseline="middle";g.fillText(d[3],N*P/2,N*P*.56);
 g.strokeStyle="#000";g.lineWidth=P;g.strokeRect(P/2,P/2,N*P-P,N*P-P);
 try{return _snapCache[id]=c.toDataURL("image/png")}catch(e){return ""}}
function snapChoices(main,seed){const r=rng(seed),gs=[...GENERIC].sort(()=>r()-.5);return(main?[main]:[]).concat(gs).slice(0,4)}

function selSnap(el){beep(500,.05);picked=el.dataset.id;document.querySelectorAll(".pick").forEach(x=>x.classList.toggle("sel",x===el))}

 modal(`<h3>${b.ic} ${esc(b.name)}</h3><p>${esc(b.quest)}</p><small>Reward: ${b.xp} XP + ${b.item}</small>
 ${c?`<p>✅ Checked in on ${c.date}</p>${c.snap?decoHTML("b:"+id,c.snap,"ph")+`<button onclick="openDeco('b:${id}')">🎨 Decorate</button>`:""}`:

 <div class="hint">${esc(nextHint())}</div><div class="trayw">${PACKS.map(pk=>`<div class="ptitle">${packOpen(pk)?"✅":"🔒"} ${esc(pk.n)}${packOpen(pk)?"":` <small>— ${esc(pk.how)}</small>`}</div><div class="tray">${pk.st.map(([id,e])=>packOpen(pk)?`<button data-s="${id}" onclick="addStk('${id}')">${e}</button>`:`<button class="lock" disabled>${e}<small>🔒</small></button>`).join("")}</div>`).join("")}</div>
 <button class="go" onclick="decoDone()">✅ Done</button> <button onclick="closeModal();render()">Skip</button>`);drawStage();bindStage()}

function decoAct(a){if(a==="c"){DL=[];DS=-1;return drawStage()}const d=DL[DS];if(!d)return toast("Tap a sticker first");
 if(a==="+")d.k=Math.min(4,d.k*1.2);if(a==="-")d.k=Math.max(.3,d.k/1.2);if(a==="l")d.r-=15;if(a==="r")d.r+=15;if(a==="x"){DL.splice(DS,1);DS=-1}beep(400,.04);drawStage()}
function bindStage(){const st=document.getElementById("stage"),pts=new Map();let pinch=null;
 st.onpointerdown=e=>{const el=e.target.closest(".stk");pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&DL[DS]){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:DL[DS].k};return}
  if(el){DS=+el.dataset.i;drawStage();try{st.setPointerCapture(e.pointerId)}catch(_){}}else{DS=-1;drawStage()}};
 st.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const d=DL[DS];if(!d)return;
  if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];d.k=Math.max(.3,Math.min(4,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/(pinch.d||1)))}
  else{const r=st.getBoundingClientRect();d.x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));d.y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}
  const el=st.querySelector(`.stk[data-i="${DS}"]`);if(el){el.style.left=d.x*100+"%";el.style.top=d.y*100+"%";el.style.fontSize=(d.k*14).toFixed(2)+"cqw"}};
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null};st.onpointerup=up;st.onpointercancel=up}
function decoDone(){S.deco[DK]=DL.map(d=>({s:d.s,x:+d.x.toFixed(3),y:+d.y.toFixed(3),k:+d.k.toFixed(2),r:d.r}));save();closeModal();beep(880,.15);toast("📔 Saved to Journal!");render()}

 ["🎯","Daily Missions","Every day you get 3 new real-life missions. Finish them for XP, items, and sticker packs!"],

function tutorial(i){const[ic,t,d]=TUT[i];modal(`<div class="tut"><small>${i+1}/${TUT.length}</small><b class="big">${ic}</b><h3>${t}</h3><p>${d}</p></div>${i+1<TUT.length?`<button class="go" onclick="tutorial(${i+1})">Next ▶</button> <button onclick="closeModal();openHub()">Skip</button>`:`<button class="go" onclick="closeModal();openHub()">Let's play! 🎮</button>`}`);beep(500+i*60,.06)}

 const r=rng("today"+today()),open=BIOMES.filter(b=>!S.biomes[b.id]),bq=(open.length?open:BIOMES)[Math.floor(r()*(open.length||BIOMES.length))],dn=S.daily[today()]||[],mi=todaysMissions().find(i=>!dn.includes(i));
 document.getElementById("hubToday").innerHTML=`<div class="card" style="max-width:520px;margin:10px auto"><h3>🌟 Today's Adventure</h3><div class="grid" style="justify-content:center">
  <button class="go" onclick="closeHub();openBiome('${bq.id}')">${bq.ic} ${esc(bq.name)}</button>${mi!=null?`<button class="go" style="background:#8e24aa" onclick="closeHub();document.querySelector('[data-tab=daily]').click()">🎯 ${esc(MISSIONS[mi][0])}</button>`:`<span><small>✅ All of today's missions done!</small></span>`}</div></div>`;
 document.getElementById("hub").classList.remove("hidden")}
function closeHub(){document.getElementById("hub").classList.add("hidden");beep(440,.05)}
function openChest(){if(S.chestDay===today())return;S.chestDay=today();const n=Math.min(5,(S.streak||{n:1}).n),it=CHEST[Math.floor(Math.random()*CHEST.length)];gain(10*n,it);
 modal(`<div class="tut"><b class="big">🎁</b><h3>Daily Chest!</h3><p>You got <b>${it}</b> and <b>+${10*n} XP</b>!</p><p>🔥 ${n}-day streak bonus</p></div><button class="go" onclick="closeModal();openHub()">Yay!</button>`);[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*120))}
function renamePlayer(){askName()}
function resetAll(){if(confirm("Erase ALL progress?")){localStorage.removeItem(KEY);S=load();render();askName()}}
document.querySelectorAll("nav button[data-tab]").forEach(btn=>btn.onclick=()=>{beep(330,.05);document.querySelectorAll("nav button[data-tab]").forEach(x=>x.classList.toggle("on",x===btn));document.querySelectorAll("main section").forEach(s=>s.classList.toggle("hidden",s.id!=="tab-"+btn.dataset.tab))});
document.getElementById("soundBtn").onclick=()=>{S.sound=!S.sound;save();render()};
checkPacks(!S.name);render();if(!S.name)askName();else{openHub()}

(function(){
const KEY="realcraft_music_v1";let on=localStorage.getItem(KEY)!=="off";
let ctx=null,master=null,cur=null,want="home",timer=null,rate=1;const voices={};
// note: semitones from A4 (0=A4); null=rest. Each step is an 8th note.
const T={
 build:{bpm:120,w:"square",m:[0,4,7,12,null,7,9,7, 5,9,12,null,9,7,5,4, 2,5,9,14,null,12,9,7, 4,7,12,11,12,null,null,null],b:[-24,null,-12,null,-17,null,-12,null, -19,null,-7,null,-17,null,-5,null, -22,null,-10,null,-17,null,-5,null, -20,null,-8,null,-24,null,null,null]},

 xmas:{bpm:138,w:"square",m:[7,11,14,11,7,null,9,null, 7,11,14,16,14,null,null,null, 12,11,9,7,9,null,11,null, 7,9,11,9,7,null,null,null],b:[-17,-10,-17,-10,-15,-8,-15,-8, -17,-10,-17,-10,-12,-5,-12,-5, -12,-5,-12,-5,-15,-8,-15,-8, -17,-10,-17,-10,-17,null,null,null],bell:true}

const hz=n=>440*Math.pow(2,n/12);
function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.25*.35;master.connect(ctx.destination);timer=setInterval(tick,100)}
function voice(name){if(!voices[name]){const g=ctx.createGain();g.gain.value=0;g.connect(master);voices[name]={g,step:0,next:ctx.currentTime+.05}}return voices[name]}

function tick(){if(!ctx||ctx.state!=="running")return;const now=ctx.currentTime;
 for(const name in voices){const v=voices[name];if(name!==cur&&v.g.gain.value<.01)continue;const tr=T[name],sp=60/tr.bpm/2/(name==="race"?rate:1);if(v.next<now-.5)v.next=now+.05;
  while(v.next<now+.3){const i=v.step%tr.m.length,m=tr.m[i],b=tr.b[i];if(m!=null)note(v,hz(m),v.next,sp*.9,tr.w,.5);if(b!=null)note(v,hz(b),v.next,sp*.95,"triangle",.7);if(tr.bell&&i%4===0)note(v,hz(m!=null?m+24:31),v.next,.25,"sine",.18);if(i%2===0&&tr.bpm>120)note(v,hz(40+(i%4?0:4)),v.next,.03,"square",.08);v.next+=sp;v.step++}}}

["pointerdown","touchend","keydown"].forEach(e=>addEventListener(e,unlock,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume()});
function setOn(v){on=v;localStorage.setItem(KEY,on?"on":"off");btn.textContent=on?"🎵":"🔇";btn.title=btn.ariaLabel=on?"Music on (tap to turn off)":"Music off (tap to turn on)";btn.classList.toggle("off",!on);if(ctx){apply();if(on)ctx.resume();else setTimeout(()=>{if(!on)ctx.suspend()},1300)}}
const st=document.createElement("style");st.textContent="#musicBtn{position:fixed;right:8px;top:8px;z-index:9999;width:54px;height:54px;border-radius:50%;border:3px solid #000;background:#ffca28;font-size:28px;line-height:1;padding:0;box-shadow:0 3px 0 #000;cursor:pointer}#musicBtn.off{background:#9e9e9e}";document.head.appendChild(st);
