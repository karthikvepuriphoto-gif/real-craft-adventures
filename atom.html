function shrink(B){let lv=0;const L=[
 ["A copper wire","Copper wire carries electricity to lights and outlets in your house. Let's shrink down and look inside!"],

 B.innerHTML=`<div class="row"><canvas id="c" width="460" height="340"></canvas><div class="side"><div class="big" id="t"></div><p id="d"></p><button id="in">🔍 Shrink more</button> <button id="out">🔎 Grow back</button><div class="why">⚛️ Everything (you, the air, your iPad) is made of atoms. Atoms are so small that a single grain of sand has more atoms than there are grains of sand on all of Earth's beaches!</div></div></div>`;
 const c=$("c"),g=c.getContext("2d");const set=()=>{$("t").textContent=(lv+1)+". "+L[lv][0];$("d").textContent=L[lv][1];if(lv===4)badge("shrink","Atom explorer!")};

   if(lv===2)for(let i=0;i<40;i++){const x=((i*53+t*.04*(1+i%3))%480)-10,y=(i*37)%330+8+Math.sin(t*.003+i)*6;g.fillStyle="#4fc3f7";g.beginPath();g.arc(x,y,4,0,7);g.fill()}}

function stat(B){const st={bal:0,hair:0,near:false};
 B.innerHTML=`<div class="row"><canvas id="c" width="420" height="320"></canvas><div class="side"><p><button id="rub">🧶 Rub balloon on hair</button><button id="near">🤏 Bring balloon close</button><button id="rst">↩️ Reset</button></p><p id="st" class="big"></p><div class="why">Rubbing moves electrons (−) from your hair onto the balloon. Now the balloon has extra − charge and your hair has extra + charge. Opposite charges attract, so your hair reaches toward the balloon! Same charges push apart, so the + hairs also spread away from each other.<br><br>🔬 Try it hands-on in the <a href="timemachine.html#lab">Inventors Lab</a> static experiment!</div></div></div>`;

const hz=n=>440*Math.pow(2,n/12);
function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.25*.35;master.connect(ctx.destination);timer=setInterval(tick,100)}

  while(v.next<now+.3){const i=v.step%tr.m.length,m=tr.m[i],b=tr.b[i];if(m!=null)note(v,hz(m),v.next,sp*.9,tr.w,.5);if(b!=null)note(v,hz(b),v.next,sp*.95,"triangle",.7);if(tr.bell&&i%4===0)note(v,hz(m!=null?m+24:31),v.next,.25,"sine",.18);if(i%2===0&&tr.bpm>120)note(v,hz(40+(i%4?0:4)),v.next,.03,"square",.08);v.next+=sp;v.step++}}}

function play(name){want=name;if(!ctx)return;if(name===cur)return;cur=name;const v=voice(name);if(v.g.gain.value<.01){v.step=0;v.next=ctx.currentTime+.05}apply()}
