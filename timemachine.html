 L.innerHTML=`<div class="exp"><svg id="cSvg" viewBox="0 0 420 300" width="420" height="300"></svg><div class="side"><p><b>Make the bulb light up!</b> Tap the two gaps (⚡) to connect the wires, then flip the switch.</p><button id="cSw">🔘 Switch: OFF</button><div id="cWhy" class="why">Electricity only flows when there's a complete loop, called a <b>circuit</b>. The battery pushes tiny particles called <b>electrons</b> through the wire and the bulb's thin filament, which glows!<br><br>🧑‍🔬 <b>Real inventors:</b> Alessandro Volta made the first battery in 1800. Thomas Edison, Joseph Swan and Lewis Latimer helped make long-lasting bulbs (1879 to 1882). <br><br>⚛️ Want to see electrons up close? Try <a href="atom.html">Atom Explorer</a>!</div></div></div>`;
 const draw=()=>{const on=st.g1&&st.g2&&st.sw;const w=(c)=>c?"#ff9800":"#555";
  $("cSvg").innerHTML=`<rect x="30" y="110" width="70" height="120" rx="10" fill="#424242"/><rect x="50" y="98" width="30" height="14" fill="#bdbdbd"/><text x="65" y="180" fill="#fdd835" font-size="28" text-anchor="middle">+</text><text x="65" y="215" fill="#fff" font-size="12" text-anchor="middle">BATTERY</text>
  <path d="M65 98 V40 H170" stroke="${w(on)}" stroke-width="6" fill="none"/><path d="M230 40 H330 V110" stroke="${w(on)}" stroke-width="6" fill="none"/><path d="M330 190 V270 H260" stroke="${w(on)}" stroke-width="6" fill="none"/><path d="M200 270 H65 V230" stroke="${w(on)}" stroke-width="6" fill="none"/>

  <g id="g2" style="cursor:pointer">${st.g2?`<path d="M200 270 H260" stroke="${w(on)}" stroke-width="6"/>`:`<rect x="202" y="250" width="56" height="40" rx="8" fill="#fff59d" stroke="#000" stroke-width="2"/><text x="230" y="277" font-size="20" text-anchor="middle">⚡</text>`}</g>
  <circle cx="330" cy="150" r="${on?60:0}" fill="url(#gl)" opacity=".8"/><defs><radialGradient id="gl"><stop offset="0" stop-color="#fff59d"/><stop offset="1" stop-color="#fff59d" stop-opacity="0"/></radialGradient></defs>

  ${on?[0,1,2,3,4,5].map(i=>`<circle r="5" fill="#4fc3f7"><animateMotion dur="3s" begin="${i*.5}s" repeatCount="indefinite" path="M65 98 V40 H330 V270 H65 Z"/></circle>`).join(""):""}`;
  $("g1").onclick=()=>{st.g1=true;draw();beep(600)};$("g2").onclick=()=>{st.g2=true;draw();beep(600)};if(on)labDone("circuit","You lit the bulb!")};
 $("cSw").onclick=()=>{st.sw=!st.sw;$("cSw").textContent="🔘 Switch: "+(st.sw?"ON":"OFF");draw();if(st.sw&&!(st.g1&&st.g2))toast("The loop has a gap! Tap the ⚡ gaps.")};draw()}
// --- series vs parallel
function labSeries(L){const st={mode:"series",a:true,b:true,tried:{}};
 L.innerHTML=`<div class="exp"><svg id="sSvg" viewBox="0 0 420 280" width="420" height="280"></svg><div class="side"><p><button id="sSer">➡️ Series</button><button id="sPar">🔀 Parallel</button></p><p><button id="sA">🔧 Unscrew bulb A</button><button id="sB">🔧 Unscrew bulb B</button></p><div id="sWhy" class="why"></div></div></div>`;
 const draw=()=>{const ser=st.mode==="series";let A,B2;if(ser){const on=st.a&&st.b;A=st.a&&on?.55:0;B2=st.b&&on?.55:0}else{A=st.a?1:0;B2=st.b?1:0}
  const bulb=(x,y,lv,has,n)=>has?`<circle cx="${x}" cy="${y}" r="${18+lv*40}" fill="#fff59d" opacity="${lv*.6}"/><circle cx="${x}" cy="${y}" r="24" fill="${lv>.8?"#ffeb3b":lv>0?"#fff59d":"#eceff1"}" stroke="#000" stroke-width="3"/><text x="${x}" y="${y+5}" font-size="14" text-anchor="middle">${n}</text>`:`<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="#bbb" stroke-dasharray="4"/><text x="${x}" y="${y+5}" font-size="12" text-anchor="middle" fill="#999">empty</text>`;
  $("sSvg").innerHTML=ser?`<rect x="20" y="100" width="60" height="90" rx="8" fill="#424242"/><path d="M50 100 V40 H370 V240 H50 V190" stroke="#555" stroke-width="5" fill="none"/>${bulb(170,40,A,st.a,"A")}${bulb(280,40,B2,st.b,"B")}<text x="210" y="150" font-size="16" text-anchor="middle">One loop: the electricity goes through A, then B</text>`
  :`<rect x="20" y="100" width="60" height="90" rx="8" fill="#424242"/><path d="M50 100 V30 H370 V250 H50 V190 M170 30 V250 M280 30 V250" stroke="#555" stroke-width="5" fill="none"/>${bulb(170,140,A,st.a,"A")}${bulb(280,140,B2,st.b,"B")}<text x="210" y="275" font-size="14" text-anchor="middle">Two paths: each bulb has its own loop</text>`;
  $("sWhy").innerHTML=ser?"<b>Series:</b> one single path. The bulbs share the battery's push, so they're dimmer. Take one bulb out and the loop breaks, so <b>both</b> go dark!":"<b>Parallel:</b> each bulb gets its own path, so they're brighter, and if one goes out, the other <b>stays on</b>. That's why the lights in your house are wired in parallel!";
  $("sA").textContent=(st.a?"🔧 Unscrew":"💡 Put back")+" bulb A";$("sB").textContent=(st.b?"🔧 Unscrew":"💡 Put back")+" bulb B";if(!(st.a&&st.b))st.tried[st.mode]=1;if(st.tried.series&&st.tried.parallel)labDone("series","Circuit detective!")};
 $("sSer").onclick=()=>{st.mode="series";draw()};$("sPar").onclick=()=>{st.mode="parallel";draw()};$("sA").onclick=()=>{st.a=!st.a;draw()};$("sB").onclick=()=>{st.b=!st.b;draw()};draw()}
// --- electromagnet
function labEmag(L){const st={wraps:5,bat:1,on:false};
 L.innerHTML=`<div class="exp"><svg id="eSvg" viewBox="0 0 420 280" width="420" height="280"></svg><div class="side"><p><b>Wire wraps:</b> <span id="eW">5</span></p><input type="range" id="eR" min="0" max="30" value="5"><p><button id="eB">🔋 Batteries: 1</button><button id="eOn">⚡ Power: OFF</button></p><p id="eC" style="font-size:20px"></p><div class="why">When electricity flows through a coil of wire, it makes a <b>magnetic field</b>, and the iron nail inside becomes a magnet! More wraps or more batteries make it stronger. Turn the power off and the paper clips drop.<br><br>🧑‍🔬 William Sturgeon made the first electromagnet in 1825, and Joseph Henry made much stronger ones. Electromagnets are inside speakers, doorbells and junkyard cranes!</div></div></div>`;
 const draw=()=>{const n=st.on?Math.min(10,Math.floor(st.wraps*st.bat/5)):0;$("eW").textContent=st.wraps;
  let coil="";for(let i=0;i<st.wraps;i++){const x=130+i*(160/Math.max(1,st.wraps));coil+=`<ellipse cx="${x}" cy="100" rx="4" ry="22" fill="none" stroke="${st.on?"#ff9800":"#b87333"}" stroke-width="3"/>`}
  let clips="";for(let i=0;i<12;i++){const up=i<n;const x=140+(i%6)*28,y=up?132+Math.floor(i/6)*22:250-Math.floor(i/6)*10;clips+=`<rect x="${x}" y="${y}" width="10" height="20" rx="5" fill="none" stroke="#78909c" stroke-width="3" transform="rotate(${up?0:70} ${x+5} ${y+10})"/>`}
  $("eSvg").innerHTML=`<rect x="110" y="90" width="210" height="20" rx="4" fill="#9e9e9e"/><polygon points="320,90 345,100 320,110" fill="#9e9e9e"/>${coil}<rect x="20" y="70" width="60" height="70" rx="8" fill="#424242"/><text x="50" y="112" fill="#fdd835" font-size="16" text-anchor="middle">${st.bat}×🔋</text><path d="M80 90 H120 M80 120 H110 V160 H300 V122" stroke="#b87333" stroke-width="3" fill="none"/>${clips}<line x1="100" y1="270" x2="400" y2="270" stroke="#795548" stroke-width="4"/>`;
  $("eC").textContent=st.on?`🧷 Picked up ${n} paper clip${n===1?"":"s"}!`:"Power is off.";if(n>=5)labDone("emag","Super electromagnet!")};
 $("eR").oninput=e=>{st.wraps=+e.target.value;draw()};$("eB").onclick=()=>{st.bat=st.bat===1?2:1;$("eB").textContent="🔋 Batteries: "+st.bat;draw()};$("eOn").onclick=()=>{st.on=!st.on;$("eOn").textContent="⚡ Power: "+(st.on?"ON":"OFF");draw()};draw()}
// --- static electricity
function labStatic(L){let charge=0,lastX=null;const tried={};
 L.innerHTML=`<div class="exp"><canvas id="stC" width="420" height="300"></canvas><div class="side"><p><b>Rub the balloon on the sweater!</b> Drag back and forth over the sweater (or tap 🧶 Rub).</p><button id="stRub">🧶 Rub</button><div class="meter"><div id="stM"></div></div><p><button data-t="hair">💇 Hold near hair</button><button data-t="paper">📄 Near paper bits</button><button data-t="wall">🧱 Stick to wall</button></p><div id="stWhy" class="why">Rubbing moves tiny <b>electrons</b> from the sweater onto the balloon. Now the balloon has extra negative charge, and it pulls on things nearby. Opposite charges attract!<br><br>🧑‍🔬 Benjamin Franklin studied electricity and in 1752 showed lightning is electricity too. (Never fly kites in storms!)<br><br>⚛️ See electrons hop in <a href="atom.html">Atom Explorer</a>!</div></div></div>`;
 const c=$("stC"),g=c.getContext("2d");let mode=null,mt=0;
 const draw=()=>{g.clearRect(0,0,420,300);g.fillStyle="#e3f2fd";g.fillRect(0,0,420,300);g.fillStyle="#8e24aa";g.fillRect(20,170,170,120);g.fillStyle="#ab47bc";for(let y=180;y<290;y+=12)for(let x=26;x<186;x+=12)g.fillRect(x,y,6,6);g.fillStyle="#fff";g.font="14px sans-serif";g.fillText("sweater",70,165);
  const k=Math.min(1,mt/30);let bx=280,by=110;if(mode==="hair"){bx=280;by=80}if(mode==="paper"){bx=300;by=170}if(mode==="wall"){bx=380;by=120}
  if(mode==="hair"){g.fillStyle="#f5cba7";g.fillRect(250,180,60,60);g.strokeStyle="#3e2723";g.lineWidth=3;for(let i=0;i<9;i++){g.beginPath();g.moveTo(254+i*6,182);const up=charge>.3?k*charge:0;g.lineTo(254+i*6+(i-4)*4*up,182-10-40*up);g.stroke()}}
  if(mode==="paper"){for(let i=0;i<10;i++){const up=charge>.3?k*charge:0;g.fillStyle="#fafafa";g.strokeStyle="#999";const x=270+i*8,y=280-up*(80+(i%3)*10);g.fillRect(x,y,6,6);g.strokeRect(x,y,6,6)}}
  if(mode==="wall"){g.fillStyle="#bcaaa4";g.fillRect(400,0,20,300)}
  g.fillStyle="#e53935";g.beginPath();g.ellipse(bx,by,34,42,0,0,7);g.fill();g.strokeStyle="#333";g.beginPath();g.moveTo(bx,by+42);g.lineTo(bx,by+(mode==="wall"&&charge<.3?150:90));g.stroke();
  g.fillStyle="#fff";g.font="bold 16px sans-serif";for(let i=0;i<Math.round(charge*8);i++)g.fillText("−",bx-20+(i%4)*12,by-10+Math.floor(i/4)*18);
  if(mode==="wall"&&charge<.3){g.fillStyle="#000";g.font="14px sans-serif";g.fillText("falls…",bx-60,by+60)}
  $("stM").style.width=(charge*100)+"%"};
 const rub=a=>{charge=Math.min(1,charge+a);mode=null;draw();if(charge>=1)toast("⚡ Fully charged! Now try hair, paper or the wall.")};
 c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*420/r.width,y=(e.clientY-r.top)*300/r.height;if(e.buttons||e.pointerType==="touch"){if(x<190&&y>160){if(lastX!=null)rub(Math.abs(x-lastX)/600);lastX=x}}});c.addEventListener("pointerup",()=>lastX=null);
 $("stRub").onclick=()=>rub(.25);
 L.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{mode=b.dataset.t;mt=0;tried[mode]=1;if(charge<.3)toast("The balloon needs more charge. Rub it first!");if(charge>=.3&&Object.keys(tried).length>=2)labDone("static","Static scientist!");const an=()=>{mt++;draw();if(mt<30)requestAnimationFrame(an);else charge=Math.max(0,charge-.15)};an()});draw()}
// --- levers & pulleys
function labLever(L){const st={f:50,ropes:1,tried:{}};
 L.innerHTML=`<div class="exp"><svg id="lSvg" viewBox="0 0 420 300" width="420" height="300"></svg><div class="side"><h3>⚖️ Lever</h3><p>Slide the <b>fulcrum</b> (the triangle). The box weighs 100 pounds.</p><input type="range" id="lR" min="10" max="90" value="50"><p id="lT"></p><h3>🪝 Pulley</h3><p>How many rope sections hold up the box? <button data-r="1">1</button><button data-r="2">2</button><button data-r="4">4</button></p><p id="pT"></p><div class="why">Simple machines trade <b>force</b> for <b>distance</b>. Put the fulcrum close to the box (or add more ropes) and you push with less force, but you have to move farther.<br><br>🧑‍🔬 The ancient Greek inventor Archimedes explained levers over 2,000 years ago. He is said to have joked, "Give me a place to stand and I will move the Earth!"</div></div></div>`;
 const draw=()=>{const fx=40+st.f*3.4,loadArm=fx-40,effArm=380-fx,eff=Math.round(100*loadArm/effArm),pull=Math.round(100/st.ropes);
  let pr="";const px=330;for(let i=0;i<st.ropes;i++){pr+=`<line x1="${px-30+i*16}" y1="200" x2="${px-30+i*16}" y2="250" stroke="#795548" stroke-width="3"/>`}
  $("lSvg").innerHTML=`<line x1="30" y1="120" x2="390" y2="120" stroke="#8d6e63" stroke-width="10"/><polygon points="${fx},124 ${fx-18},160 ${fx+18},160" fill="#455a64"/><rect x="25" y="80" width="40" height="38" fill="#a1887f" stroke="#000"/><text x="45" y="104" font-size="12" text-anchor="middle">100 lb</text><text x="375" y="105" font-size="22" text-anchor="middle">👇</text>
  <line x1="${px-30}" y1="185" x2="${px+20}" y2="185" stroke="#555" stroke-width="4"/><circle cx="${px-22}" cy="200" r="12" fill="none" stroke="#555" stroke-width="3"/>${pr}<rect x="${px-45}" y="250" width="60" height="36" fill="#a1887f" stroke="#000"/><text x="${px-15}" y="273" font-size="12" text-anchor="middle">100 lb</text><text x="120" y="230" font-size="14">Pulley: pull with ${pull} lb</text>`;
  $("lT").innerHTML=`Push down with about <b>${eff} pounds</b> ${eff<100?"💪 Easier than lifting!":eff>100?"😓 Harder!":""}`;$("pT").innerHTML=`Pull with about <b>${pull} pounds</b>, but pull <b>${st.ropes}×</b> as much rope.`;
  if(eff<50)st.tried.lever=1;if(st.ropes===4)st.tried.pulley=1;if(st.tried.lever&&st.tried.pulley)labDone("lever","Simple machine master!")};
 $("lR").oninput=e=>{st.f=+e.target.value;draw()};L.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{st.ropes=+b.dataset.r;draw()});draw()}
// --- magnets
function labMagnet(L){const st={flip:false,res:"",tested:{}};const OBJ=[["🧷","Steel paper clip",true],["🔩","Iron nail",true],["🪙","US penny",false],["🥫","Aluminum can",false],["🪀","Rubber band",false],["🔑","Steel key",true]];
 L.innerHTML=`<div class="exp"><svg id="mSvg" viewBox="0 0 420 200" width="420" height="200"></svg><div class="side"><p><button id="mFlip">🔄 Flip right magnet</button><button id="mPush">🤝 Push together</button></p><p id="mRes" style="font-size:18px"></p><h3>Is it magnetic?</h3><div id="mObj"></div><div class="why">Every magnet has a <b>north (N)</b> and <b>south (S)</b> pole. Opposite poles attract and the same poles push apart. Magnets pull on iron, steel, nickel and cobalt, but not on copper, aluminum, plastic or rubber. A US penny isn't magnetic!<br><br>🧭 Earth is like a giant magnet, which is why a compass needle points north. People in China used magnetic compasses for navigation over 900 years ago.</div></div></div>`;
 const draw=(gap=60)=>{const R2=st.flip?["S","N"]:["N","S"];const lE=200-gap/2,rS=220+gap/2;const col=c=>c==="N"?"#e53935":"#1e88e5";const bar=(x,a,b)=>`<rect x="${x}" y="70" width="60" height="50" fill="${col(a)}"/><rect x="${x+60}" y="70" width="60" height="50" fill="${col(b)}"/><text x="${x+30}" y="102" fill="#fff" font-size="20" text-anchor="middle">${a}</text><text x="${x+90}" y="102" fill="#fff" font-size="20" text-anchor="middle">${b}</text>`;$("mSvg").innerHTML=bar(lE-120,"N","S")+bar(rS,R2[0],R2[1])};
 $("mFlip").onclick=()=>{st.flip=!st.flip;draw()};
 $("mPush").onclick=()=>{const attract=!st.flip;let g=60,t=0;const an=()=>{t++;if(attract)g=Math.max(0,60-t*4);else g=t<10?60-t*3:30+(t-10)*4;draw(Math.min(60,g));if(t<20)requestAnimationFrame(an);else{$("mRes").textContent=attract?"🧲 S meets N: they snap together! Opposites attract.":"💨 S meets S: they push apart! Same poles repel.";st.tested["p"+attract]=1;chk()}};an()};
 $("mObj").innerHTML=OBJ.map((o,i)=>`<button data-i="${i}">${o[0]} ${o[1]}</button>`).join("");
 const chk=()=>{if(Object.keys(st.tested).length>=OBJ.length+2)labDone("magnet","Magnet expert!")};
 $("mObj").querySelectorAll("button").forEach(b=>b.onclick=()=>{const o=OBJ[+b.dataset.i];b.style.background=o[2]?"#66bb6a":"#ef9a9a";b.textContent=`${o[0]} ${o[1]}: ${o[2]?"YES 🧲":"no"}`;st.tested[o[1]]=1;chk()});draw()}

const hz=n=>440*Math.pow(2,n/12);
function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.25*.35;master.connect(ctx.destination);timer=setInterval(tick,100)}
function voice(name){if(!voices[name]){const g=ctx.createGain();g.gain.value=0;g.connect(master);voices[name]={g,step:0,next:ctx.currentTime+.05}}return voices[name]}

function tick(){if(!ctx||ctx.state!=="running")return;const now=ctx.currentTime;
 for(const name in voices){const v=voices[name];if(name!==cur&&v.g.gain.value<.01)continue;const tr=T[name],sp=60/tr.bpm/2/(name==="race"?rate:1);if(v.next<now-.5)v.next=now+.05;
  while(v.next<now+.3){const i=v.step%tr.m.length,m=tr.m[i],b=tr.b[i];if(m!=null)note(v,hz(m),v.next,sp*.9,tr.w,.5);if(b!=null)note(v,hz(b),v.next,sp*.95,"triangle",.7);if(tr.bell&&i%4===0)note(v,hz(m!=null?m+24:31),v.next,.25,"sine",.18);if(i%2===0&&tr.bpm>120)note(v,hz(40+(i%4?0:4)),v.next,.03,"square",.08);v.next+=sp;v.step++}}}

function play(name){want=name;if(!ctx)return;if(name===cur)return;cur=name;const v=voice(name);if(v.g.gain.value<.01){v.step=0;v.next=ctx.currentTime+.05}apply()}
