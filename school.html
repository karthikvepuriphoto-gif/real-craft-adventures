<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elementary School - Real Craft Adventures</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#2e3b2e;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 20px) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:#1b5e20;border-bottom:4px solid #000;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header .st{background:#ffca28;color:#000;padding:6px 10px;border:3px solid #000;font-weight:bold}
button{font:inherit;font-size:16px;padding:12px 14px;border:3px solid #000;background:#fff;color:#000;box-shadow:0 3px 0 #000;cursor:pointer;border-radius:4px}button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button.go{background:#66bb6a}button.y{background:#ffca28}button.b{background:#4fc3f7}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:#fffde7;color:#212121;border:4px solid #000;padding:16px;margin:12px 0;border-radius:6px;line-height:1.55;font-size:17px}
.card h2{margin:0 0 8px;font-size:22px}.card h3{margin:6px 0}.std{display:inline-block;background:#e3f2fd;border:2px solid #1565c0;color:#0d47a1;font-size:12px;padding:2px 6px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;font-size:17px;min-height:120px;justify-content:center}.tile b{font-size:44px;line-height:1}.tile small{font-size:12px;color:#333}
.trick{background:#fff3e0;border:3px dashed #ef6c00;padding:10px;border-radius:6px;margin-top:10px}
.opts{display:grid;gap:10px;margin-top:12px}.opts button{text-align:left;font-size:18px}.opts .right{background:#a5d6a7}.opts .wrong{background:#ef9a9a}
.fb{margin-top:10px;font-weight:bold}.big2{font-size:34px;letter-spacing:2px;display:block;margin:8px 0;word-break:break-all}
.passage{background:#e8f5e9;border-left:6px solid #2e7d32;padding:8px 12px;margin-bottom:10px}
.prog{height:14px;background:#ccc;border:2px solid #000;margin:8px 0}.prog i{display:block;height:100%;background:#43a047}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border:2px solid #000;padding:6px;text-align:left}th{background:#c8e6c9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;flex-direction:column;align-items:center;width:110px;padding:8px;margin:4px;background:#fff;border:3px solid #000;border-radius:6px;font-size:12px;text-align:center}.badge b{font-size:34px}.badge.off{opacity:.35;filter:grayscale(1)}
#toast{position:fixed;left:0;right:0;bottom:24px;margin:auto;width:fit-content;max-width:92vw;background:#000c;color:#ffeb3b;padding:12px 16px;border:3px solid #ffca28;font-size:16px;z-index:20;display:none}
</style></head><body>
<header><button onclick="location.href='buildworld.html'">🌍 Build World</button><h1>🏫 Elementary School</h1><span class="st" id="stars">⭐ 0</span><button class="b" id="speak">🔊 Read to me</button></header>
<main id="main"></main><div id="toast"></div>
<script type="module">
import {SUBJ,GRADES,lessons,toQ,shuffle,trickFor,HT2STATE,STATEHIST} from "./schooldata.js";
import {getHometown,htName} from "./hometown.js";
const KEY="realcraft_school_v1",KEYG="realcraft_grade_v1";
const HTO=getHometown()||{id:"lincoln",name:"Lincoln"},STK=HT2STATE[HTO.id]||"usa",ST=STATEHIST[STK];
let S;try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}S.stars=S.stars||{};S.badges=S.badges||[];S.missed=S.missed||{};S.drills=S.drills||0;S.grade=S.grade||localStorage.getItem(KEYG)||"3";
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEYG,S.grade);upd()};
const total=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);const upd=()=>document.getElementById("stars").textContent="⭐ "+total();
const $=document.getElementById("main");const gname=g=>g==="K"?"Kindergarten":"Grade "+g;
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)};
const beep=(f,d=.1)=>{try{const A=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}};
function speak(t){if(!window.speechSynthesis)return toast("🔇 Read-aloud isn't available on this device");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[⭐🔢🔬🗺️📚🏫✅❌🎉]/gu,"").replace(/×/g," times ").replace(/÷/g," divided by ").replace(/−/g," minus "));u.rate=.92;speechSynthesis.speak(u)}
document.getElementById("speak").onclick=()=>speak($.innerText);
const BADGES=[["first","🎒","First Lesson","Finish any quiz"],["perfect","💯","Perfect Score","Get 5/5 on a quiz"],["math","🔢","Math Whiz","3 stars on every math lesson in a grade"],["science","🔬","Young Scientist","3 stars on every science lesson in a grade"],["history","🗺️","Historian","3 stars on every social studies lesson in a grade"],["reading","📚","Bookworm","3 stars on every reading lesson in a grade"],["times","⚡","Times Table Champ","Score 14+ out of 15 in the times-table drill"],["state","🏛️","State Expert","3 stars on your state's history lesson"],["allstar","🌟","All-Star","Earn 50 stars"]];
function award(id){if(S.badges.includes(id))return;S.badges.push(id);const b=BADGES.find(x=>x[0]===id);toast("🏅 New badge: "+b[1]+" "+b[2]+"!");beep(1046,.25)}
function checkBadges(g,subj){award("first");const L=lessons(g,subj,STK);if(L.every(l=>(S.stars[g+"|"+subj+"|"+l.id]||0)>=3))award(subj);if((S.stars[`4|history|statehist`]||0)>=3||(S.stars[`3|history|mystate`]||0)>=3)award("state");if(total()>=50)award("allstar")}
function addWorldStars(n){if(n>0)localStorage.setItem("realcraft_bw_stars",(+localStorage.getItem("realcraft_bw_stars")||0)+n)}
// ---------- screens ----------
function home(){$.innerHTML=`<div class="card"><h2>Welcome to school in ${htName(HTO)}! 🍎</h2><p>Pick your grade, then visit the Math, Science, Social Studies and Reading rooms. Every lesson goes <b>Learn → Practice → Quiz</b>. Earn stars and badges!</p></div>
 <div class="grid">${GRADES.map(g=>`<button class="tile ${S.grade===g?"y":""}" data-g="${g}"><b>${g==="K"?"🧸":"📘"}</b>${gname(g)}<small>${gradeStars(g)} ⭐</small></button>`).join("")}</div>
 <div class="row" style="margin-top:14px"><button class="b" id="rc">📋 Report Card</button><button class="b" id="bd">🏅 Badges (${S.badges.length})</button></div>`;
 $.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.grade=b.dataset.g;save();grade()});rcBtn()}
function rcBtn(){const a=$.querySelector("#rc"),b=$.querySelector("#bd");if(a)a.onclick=report;if(b)b.onclick=badges}
const gradeStars=g=>Object.entries(S.stars).filter(([k])=>k.startsWith(g+"|")).reduce((a,[,v])=>a+v,0);
function grade(){const g=S.grade;$.innerHTML=`<div class="row"><button onclick="">⬅ Grades</button><h2 style="margin:0">${gname(g)}</h2></div><div class="grid" style="margin-top:12px">${SUBJ.map(([k,e,n])=>{const L=lessons(g,k,STK),got=L.reduce((a,l)=>a+(S.stars[g+"|"+k+"|"+l.id]||0),0);return`<button class="tile" data-s="${k}"><b>${e}</b>${n} Room<small>${got} / ${L.length*3} ⭐</small></button>`}).join("")}</div><div class="row" style="margin-top:14px"><button class="b" id="rc">📋 Report Card</button><button class="b" id="bd">🏅 Badges</button></div>`;
 $.querySelector("button").onclick=home;$.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>room(b.dataset.s));rcBtn();scrollTo(0,0)}
function room(subj){const g=S.grade,L=lessons(g,subj,STK),[,e,n]=SUBJ.find(x=>x[0]===subj);
 $.innerHTML=`<div class="row"><button id="bk">⬅ ${gname(g)}</button><h2 style="margin:0">${e} ${n} Room</h2></div>`+L.map(l=>{const s=S.stars[g+"|"+subj+"|"+l.id]||0;return`<div class="card"><h3>${l.t}</h3><span class="std">${l.std}</span><p>${"⭐".repeat(s)}${"☆".repeat(3-s)}</p><div class="row"><button class="go" data-l="${l.id}">${s?"🔁 Play again":"▶ Start lesson"}</button>${l.drill?'<button class="y" id="drill">⚡ Times-Table Drill</button>':""}${l.link?`<button class="b" data-href="${l.link[0]}">${l.link[1]}</button>`:""}</div></div>`}).join("");
 $.querySelector("#bk").onclick=grade;$.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>teach(subj,L.find(l=>l.id===b.dataset.l)));$.querySelectorAll("[data-href]").forEach(b=>b.onclick=()=>location.href=b.dataset.href);const d=$.querySelector("#drill");if(d)d.onclick=()=>drill();scrollTo(0,0)}
function teach(subj,l){$.innerHTML=`<div class="row"><button id="bk">⬅ Room</button></div><div class="card"><h2>🧑‍🏫 Learn: ${l.t}</h2><span class="std">${l.std}</span><div style="margin-top:10px">${l.ex}</div><div class="trick">💡 <b>Trick:</b> ${l.trick}</div></div><div class="row"><button class="go" id="pr">✏️ Practice</button><button class="y" id="qz">📝 Skip to Quiz</button>${l.link?`<button class="b" id="lk">${l.link[1]}</button>`:""}</div>`;
 $.querySelector("#bk").onclick=()=>room(subj);$.querySelector("#pr").onclick=()=>run(subj,l,"practice");$.querySelector("#qz").onclick=()=>run(subj,l,"quiz");const k=$.querySelector("#lk");if(k)k.onclick=()=>location.href=l.link[0];scrollTo(0,0)}
function makeQs(l,n){if(l.gen)return Array.from({length:n},()=>l.gen());const pool=shuffle(l.qs);return Array.from({length:n},(_,i)=>toQ(pool[i%pool.length]))}
function run(subj,l,mode){const N=mode==="practice"?4:5,qs=makeQs(l,N);let i=0,right=0;
 const show=()=>{const q=qs[i];$.innerHTML=`<div class="row"><button id="bk">⬅ Lesson</button><b>${mode==="practice"?"✏️ Practice":"📝 Quiz"} ${i+1} / ${N}</b></div><div class="prog"><i style="width:${i/N*100}%"></i></div><div class="card"><div style="font-size:20px">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button data-j="${j}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
  $.querySelector("#bk").onclick=()=>teach(subj,l);let done=false;
  $.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.j===q.a;b.classList.add(ok?"right":"wrong");$.querySelectorAll("[data-j]")[q.a].classList.add("right");if(ok)right++;beep(ok?880:260);
   $.querySelector("#fb").innerHTML=(ok?"✅ Correct! ":"❌ Not quite. ")+q.why+`<div class="row" style="margin-top:10px"><button class="go" id="nx">${i<N-1?"Next ➜":"Finish"}</button></div>`;$.querySelector("#nx").onclick=()=>{i++;i<N?show():finish()}})};
 const finish=()=>{let html;if(mode==="practice"){html=`<div class="card"><h2>👍 Practice done: ${right}/${N}</h2><p>Ready for the quiz? Get 5/5 for 3 stars!</p><div class="row"><button class="go" id="qz">📝 Take the Quiz</button><button id="again">🔁 Practice again</button></div></div>`}
  else{const stars=right>=5?3:right>=4?2:right>=3?1:0,k=S.grade+"|"+subj+"|"+l.id,old=S.stars[k]||0;if(stars>old){S.stars[k]=stars;addWorldStars(stars-old)}if(right===5)award("perfect");checkBadges(S.grade,subj);save();
   html=`<div class="card"><h2>${stars===3?"🎉 Amazing!":stars?"🌟 Nice work!":"💪 Keep practicing!"} ${right}/${N}</h2><p style="font-size:34px">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</p><p>${stars<3?"Tip: review the lesson and try again for 3 stars.":"You mastered this lesson!"}</p><div class="row"><button class="go" id="rm">🏫 Back to room</button><button id="again">🔁 Try again</button><button class="b" id="rc">📋 Report Card</button></div></div>`}
  $.innerHTML=html;const q=$.querySelector("#qz");if(q)q.onclick=()=>run(subj,l,"quiz");$.querySelector("#again").onclick=()=>run(subj,l,mode);const r=$.querySelector("#rm");if(r)r.onclick=()=>room(subj);rcBtn();scrollTo(0,0)};show();scrollTo(0,0)}
// ---------- adaptive times-table drill (3rd grade) ----------
function drill(){const N=15;const missedKeys=Object.keys(S.missed).sort((a,b)=>S.missed[b]-S.missed[a]);let queue=missedKeys.slice(0,6).map(k=>k.split("x").map(Number));while(queue.length<N)queue.push([2+Math.random()*9|0,2+Math.random()*9|0]);queue=queue.slice(0,N);let n=0,right=0,missNow=[];
 const show=()=>{const[a,b]=queue[0],p=a*b;const o=shuffle([...new Set([p,p+a,p-b>0?p-b:p+2*b,(a+1)*(b+1),p+1])].slice(0,4));if(!o.includes(p))o[0]=p;const opts=shuffle(o);
  $.innerHTML=`<div class="row"><button id="bk">⬅ Room</button><b>⚡ Drill ${n+1} / ${N}</b> <span>✅ ${right}</span></div><div class="prog"><i style="width:${n/N*100}%"></i></div><div class="card" style="text-align:center"><div style="font-size:54px;font-weight:bold">${a} × ${b}</div><div class="opts" style="grid-template-columns:1fr 1fr">${opts.map(v=>`<button data-v="${v}" style="text-align:center;font-size:28px">${v}</button>`).join("")}</div><div class="fb" id="fb"></div></div><p style="font-size:13px">Missed facts come back later in this drill and next time until you get them!</p>`;
  $.querySelector("#bk").onclick=()=>room("math");let done=false;
  $.querySelectorAll("[data-v]").forEach(btn=>btn.onclick=()=>{if(done)return;done=true;const ok=+btn.dataset.v===p,key=Math.min(a,b)+"x"+Math.max(a,b);btn.classList.add(ok?"right":"wrong");beep(ok?880:260);queue.shift();n++;
   if(ok){right++;if(S.missed[key]){S.missed[key]--;if(S.missed[key]<=0)delete S.missed[key]}}else{S.missed[key]=(S.missed[key]||0)+2;missNow.push(key);if(n<N)queue.splice(Math.min(3,queue.length),0,[a,b])}
   while(queue.length>N-n)queue.pop();save();
   $.querySelector("#fb").innerHTML=(ok?"✅ ":"❌ "+a+" × "+b+" = "+p+". ")+trickFor(a,b)+`<div class="row" style="margin-top:8px;justify-content:center"><button class="go" id="nx">${n<N?"Next ➜":"Finish"}</button></div>`;$.querySelector("#nx").onclick=()=>n<N?show():end()})};
 const end=()=>{S.drills++;if(right>=14)award("times");const add=right>=14?3:right>=11?2:right>=8?1:0;const k="3|math|drill",old=S.stars[k]||0;if(add>old){S.stars[k]=add;addWorldStars(add-old)}save();const left=Object.keys(S.missed);
  $.innerHTML=`<div class="card"><h2>⚡ Drill done: ${right} / ${N}</h2><p style="font-size:30px">${"⭐".repeat(add)}${"☆".repeat(3-add)}</p>${left.length?`<p>Facts to practice: <b>${left.map(k=>k.replace("x"," × ")).join(", ")}</b>. They'll show up first next drill.</p>`:"<p>🎉 No missed facts right now!</p>"}<div class="row"><button class="go" id="ag">🔁 Drill again</button><button id="rm">🏫 Math Room</button></div></div>`;$.querySelector("#ag").onclick=drill;$.querySelector("#rm").onclick=()=>room("math");scrollTo(0,0)};show();scrollTo(0,0)}
// ---------- report card & badges ----------
function report(){const word=p=>p>=.85?"🌟 Excellent":p>=.6?"👍 Good":p>0?"🌱 Growing":"— Not started";
 $.innerHTML=`<div class="row"><button id="bk">⬅ Grades</button><h2 style="margin:0">📋 Report Card</h2></div><div class="card"><p>Student in <b>${htName(HTO)}</b> · Total ⭐ ${total()} · Badges ${S.badges.length}</p>`+GRADES.map(g=>{const rows=SUBJ.map(([k,e,n])=>{const L=lessons(g,k,STK);const got=L.reduce((a,l)=>a+(S.stars[g+"|"+k+"|"+l.id]||0),0),max=L.length*3;return`<tr><td>${e} ${n}</td><td>${L.map(l=>`${l.t}: ${"⭐".repeat(S.stars[g+"|"+k+"|"+l.id]||0)||"–"}`).join("<br>")}</td><td>${got}/${max}</td><td>${word(got/max)}</td></tr>`}).join("");return`<h3>${gname(g)}</h3><table><tr><th>Subject</th><th>Topics</th><th>Stars</th><th>Grade</th></tr>${rows}</table>`}).join("")+
  `<h3>⚡ Times-table facts to practice</h3><p>${Object.keys(S.missed).map(k=>k.replace("x"," × ")).join(", ")||"None right now! 🎉"}</p></div>`;$.querySelector("#bk").onclick=home;scrollTo(0,0)}
function badges(){$.innerHTML=`<div class="row"><button id="bk">⬅ Grades</button><h2 style="margin:0">🏅 Badges</h2></div><div class="card">${BADGES.map(([id,e,n,d])=>`<span class="badge ${S.badges.includes(id)?"":"off"}"><b>${e}</b><span><b style="font-size:13px">${n}</b><br>${d}</span></span>`).join("")}</div>`;$.querySelector("#bk").onclick=home;scrollTo(0,0)}
upd();(location.hash==="#grade"?grade:home)();
window.SCHOOL={S,home,grade,room,teach,run,drill,report,badges,lessons:(g,s)=>lessons(g,s,STK)};
</script></body></html>
